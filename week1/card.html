<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지현 — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --lime: #b5d66b;    /* 연두색 */
      --navy: #1f2a4d;    /* 남색 */
      --cream: #f4eedd;   /* 크림색 */
      --paper: #fbf8f0;
      --ink: #1f2a4d;
      --muted: #8a8d99;
      --line: rgba(31, 42, 77, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background: var(--cream);
      color: var(--ink);
      font-family: "Gowun Batang", serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--paper);
      padding: 56px 44px 44px;
      box-shadow: 0 1px 2px rgba(31, 42, 77, 0.04), 0 24px 60px -30px rgba(31, 42, 77, 0.25);
    }

    /* 잡지 상단 머리글 */
    .masthead {
      display: flex;
      justify-content: space-between;
      font-family: "Cormorant Garamond", serif;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .label {
      margin-top: 56px;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 18px;
      color: var(--muted);
    }

    .name {
      margin-top: 8px;
      font-family: "Gowun Batang", serif;
      font-weight: 400;
      font-size: clamp(56px, 18vw, 76px);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    .name::after {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-left: 6px;
      border-radius: 50%;
      background: var(--lime);
    }

    .intro {
      margin-top: 24px;
      font-size: 15px;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .keywords,
    .wishes,
    .colors {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .keywords { margin-top: 64px; }
    .wishes,
    .colors { margin-top: 36px; }

    /* 잡지 목차처럼 한 줄씩 */
    .wishes ul {
      margin-top: 12px;
      list-style: none;
    }

    .wishes li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-family: "Gowun Batang", serif;
      font-size: 16px;
      color: var(--navy);
    }

    .wishes li:last-child { border-bottom: none; }

    .wishes li small {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 14px;
      color: var(--muted);
    }

    .keywords ol {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      list-style: none;
      counter-reset: kw;
    }

    .keywords li {
      counter-increment: kw;
      font-family: "Gowun Batang", serif;
      font-size: 18px;
      color: var(--navy);
    }

    .keywords li::before {
      content: "0" counter(kw);
      display: block;
      margin-bottom: 6px;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 14px;
      color: var(--lime);
    }

    .keywords h2,
    .wishes h2,
    .colors h2 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .swatches {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      list-style: none;
    }

    .swatch .chip {
      aspect-ratio: 3 / 4;
      border: 1px solid var(--line);
    }

    .swatch span {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .swatch small {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .footer {
      margin-top: 36px;
      font-family: "Cormorant Garamond", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 32px 28px 28px; }
      .label { margin-top: 28px; }
      .intro { margin-top: 16px; }
      .keywords { margin-top: 32px; }
      .wishes,
      .colors { margin-top: 28px; }
      .keywords,
      .wishes,
      .colors { padding-top: 14px; }
      .keywords ol,
      .swatches { margin-top: 14px; }
      .wishes li { padding: 9px 0; }
      .swatch .chip { aspect-ratio: 1 / 1; }
      .footer { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="masthead">
      <span>Profile</span>
      <span>Vol. 01</span>
    </header>

    <p class="label">Hello, I am</p>
    <h1 class="name">지현</h1>
    <p class="intro">시각디자인 지망생</p>

    <section class="keywords">
      <h2>Keywords</h2>
      <ol>
        <li>차분함</li>
        <li>관찰</li>
        <li>수집</li>
      </ol>
    </section>

    <section class="wishes">
      <h2>Want to Make</h2>
      <ul>
        <li>앨범 디자인 <small>Album</small></li>
        <li>패키지 디자인 <small>Package</small></li>
      </ul>
    </section>

    <section class="colors">
      <h2>Favorite Colors</h2>
      <ul class="swatches">
        <li class="swatch">
          <div class="chip" style="background: var(--lime);"></div>
          <span>연두색</span>
          <small>Lime</small>
        </li>
        <li class="swatch">
          <div class="chip" style="background: var(--navy);"></div>
          <span>남색</span>
          <small>Navy</small>
        </li>
        <li class="swatch">
          <div class="chip" style="background: var(--cream);"></div>
          <span>크림색</span>
          <small>Cream</small>
        </li>
      </ul>
    </section>

    <p class="footer">Week 1 — 2026</p>
  </main>
</body>
</html>
